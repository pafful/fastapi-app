apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: fastapi-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          image: image-registry.openshift-image-registry.svc:5000/fastapi-demo/fastapi-frontend:initial
          imagePullPolicy: Always
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 300m
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: fastapi-demo
spec:
  selector:
    app: frontend
  ports:
    - name: http
      port: 80
      targetPort: 80