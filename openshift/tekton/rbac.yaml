apiVersion: v1
kind: ServiceAccount
metadata:
  name: fastapi-pipeline
  namespace: fastapi-cicd
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: fastapi-pipeline-edit
  namespace: fastapi-cicd
subjects:
  - kind: ServiceAccount
    name: fastapi-pipeline
    namespace: fastapi-cicd
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: edit
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: pipeline-image-builder
  namespace: fastapi-demo
subjects:
  - kind: ServiceAccount
    name: fastapi-pipeline
    namespace: fastapi-cicd
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:image-builder
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: pipeline-image-pusher
  namespace: fastapi-demo
subjects:
  - kind: ServiceAccount
    name: fastapi-pipeline
    namespace: fastapi-cicd
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:image-pusher